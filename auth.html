<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX | Authenticate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Extreme Glassmorphism Variables */
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop');
            --overlay: rgba(5, 5, 5, 0.8);
            --card-bg: rgba(20, 20, 20, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
        }

        /* Cinematic Themes with extreme mood */
        .theme-deathnote {
            --bg-image: url('https://images.unsplash.com/photo-1509343256512-d77a5cb3791d?q=80&w=2070&auto=format&fit=crop');
            --overlay: rgba(0, 0, 0, 0.9);
            --card-bg: rgba(10, 0, 0, 0.3);
            --accent: #dc2626; --accent-glow: rgba(220, 38, 38, 0.6);
        }
        .theme-batman {
            --bg-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2144&auto=format&fit=crop');
            --overlay: rgba(5, 5, 8, 0.85);
            --card-bg: rgba(10, 10, 15, 0.4);
            --accent: #eab308; --accent-glow: rgba(234, 179, 8, 0.5);
        }

        body { font-family: 'Outfit', sans-serif; background-image: var(--bg-image); background-size: cover; background-position: center; color: white; overflow: hidden; }

        .bg-overlay { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: -1; transition: all 0.8s ease; }

        /* Vision Pro Style Card */
        .vision-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--card-border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: slideScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideScale { 0% { opacity: 0; transform: scale(0.95) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* Sleek Avatar Ring */
        .cyber-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 70%, var(--accent) 100%);
            animation: rotateCyber 2.5s linear infinite;
        }
        .cyber-ring::before {
            content: ''; position: absolute; inset: 2px; background: #000; border-radius: 50%;
        }
        @keyframes rotateCyber { 100% { transform: rotate(360deg); } }

        /* YT Shorts Inputs (Underline only, glowing on focus) */
        .input-yt {
            width: 100%; background: transparent; color: white; padding: 12px 0; font-size: 14px;
            border: none; border-bottom: 1px solid rgba(255,255,255,0.2); outline: none; transition: all 0.3s ease;
        }
        .input-yt::placeholder { color: rgba(255,255,255,0.3); font-weight: 300; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }
        .input-yt:focus { border-bottom: 1px solid var(--accent); box-shadow: 0 10px 10px -10px var(--accent-glow); }

        /* Glow Button */
        .btn-glow {
            background: white; color: black; transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 40px var(--accent-glow); }

        /* Staggered Form */
        .stagger { animation: fadeRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .s-1 { animation-delay: 0.2s; } .s-2 { animation-delay: 0.3s; } .s-3 { animation-delay: 0.4s; }
        @keyframes fadeRight { 0% { opacity: 0; transform: translateX(-20px); } 100% { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    
    <div class="bg-overlay"></div>

    <div class="absolute top-6 left-6 z-50">
        <div class="text-xl font-black tracking-widest text-white cursor-pointer" onclick="window.location.href='/index.html'">
            VERT<span style="color: var(--accent); transition: color 0.5s;">EX</span>
        </div>
    </div>

    <!-- Hidden Theme Selector (Bottom Right for minimalism) -->
    <div class="absolute bottom-6 right-6 z-50 group flex items-center gap-3">
        <label for="customBgUpload" class="cursor-pointer bg-white/5 backdrop-blur-md p-3 rounded-full border border-white/10 hover:bg-white/10 transition-all">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </label>
        <input type="file" id="customBgUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        
        <select id="themeSelector" onchange="setTheme(this.value)" class="bg-white/5 backdrop-blur-md text-white/50 text-[10px] uppercase font-bold tracking-widest border border-white/10 outline-none cursor-pointer appearance-none px-4 py-3 rounded-full hover:text-white transition-all">
            <option value="cyber">Cyber</option>
            <option value="deathnote">Death Note</option>
            <option value="batman">Batman</option>
            <option value="custom" hidden>Custom</option>
        </select>
    </div>

    <div class="vision-card w-full max-w-[360px] rounded-[2rem] p-10 relative z-10">
        
        <!-- Ultra Sleek Avatar -->
        <div class="relative w-20 h-20 mx-auto mb-10">
            <div class="cyber-ring"></div>
            <div class="absolute inset-[2px] rounded-full overflow-hidden border border-white/10 z-10">
                <img src="https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale brightness-75 hover:grayscale-0 hover:brightness-100 transition-all duration-500" alt="Avatar">
            </div>
        </div>

        <div class="text-center mb-10 stagger s-1">
            <h2 id="formTitle" class="text-2xl font-black tracking-tight mb-1">SYSTEM LOGIN</h2>
            <div class="h-[1px] w-12 bg-white/20 mx-auto mt-3"></div>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-6">
            <div id="nameField" class="hidden stagger s-2">
                <input type="text" id="nameInput" autocomplete="name" placeholder="Legal Name" class="input-yt">
            </div>

            <div class="stagger s-2">
                <input type="email" id="emailInput" autocomplete="username" required placeholder="Network Email" class="input-yt">
            </div>

            <div class="stagger s-3 relative">
                <input type="password" id="passwordInput" autocomplete="current-password" required placeholder="Security Passcode" class="input-yt">
            </div>

            <button type="submit" id="submitBtn" class="stagger s-3 btn-glow w-full py-4 mt-4 rounded-xl font-black text-[11px] uppercase tracking-widest cursor-pointer">
                Initialize Connection
            </button>
            
            <p id="msgBox" class="text-[10px] font-bold text-center hidden mt-4 p-2 rounded-lg tracking-widest uppercase"></p>
        </form>

        <div class="stagger s-3 text-center text-[10px] mt-10 font-medium text-white/50 uppercase tracking-widest">
            <span id="toggleText">Unregistered?</span> 
            <button onclick="toggleMode()" id="toggleBtn" class="font-bold text-white hover:text-[var(--accent)] transition-colors ml-2">Request Access</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://memwikauqfvctwbrgmgf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbXdpa2F1cWZ2Y3R3YnJnbWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njc4NDcsImV4cCI6MjEwNTE0Mzg0N30.f1MbDY5DGxaYwVnOBrN8N0ODWe9ZpYGmiL2NfvyIBCo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLogin = true;

        function setTheme(theme) {
            document.body.className = `min-h-screen flex items-center justify-center p-4 relative theme-${theme}`;
            if(theme === 'cyber') document.body.className = `min-h-screen flex items-center justify-center p-4 relative`;
            localStorage.setItem('vertex_theme', theme);
            document.getElementById('themeSelector').value = theme;

            if(theme !== 'custom') {
                document.body.style.backgroundImage = '';
            } else {
                const savedImage = localStorage.getItem('vertex_custom_bg');
                if(savedImage) document.body.style.backgroundImage = `url(${savedImage})`;
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.body.style.backgroundImage = `url(${dataUrl})`;
                    localStorage.setItem('vertex_custom_bg', dataUrl);
                    let selector = document.getElementById('themeSelector');
                    if(selector.querySelector('option[value="custom"]').hidden) {
                        selector.querySelector('option[value="custom"]').hidden = false;
                    }
                    setTheme('custom');
                };
                reader.readAsDataURL(file);
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('vertex_theme') || 'cyber';
            setTheme(savedTheme);
        };

        function toggleMode() {
            isLogin = !isLogin;
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const formTitle = document.getElementById('formTitle');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');
            const passInput = document.getElementById('passwordInput');

            if (isLogin) {
                nameField.classList.add('hidden');
                document.getElementById('nameInput').removeAttribute('required');
                submitBtn.innerText = 'Initialize Connection';
                formTitle.innerText = 'SYSTEM LOGIN';
                toggleText.innerText = "Unregistered?";
                toggleBtn.innerText = 'Request Access';
                passInput.setAttribute('autocomplete', 'current-password');
            } else {
                nameField.classList.remove('hidden');
                document.getElementById('nameInput').setAttribute('required', 'true');
                submitBtn.innerText = 'Establish Identity';
                formTitle.innerText = 'NEW CLEARANCE';
                toggleText.innerText = "Authorized?";
                toggleBtn.innerText = 'Return';
                passInput.setAttribute('autocomplete', 'new-password');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');

            btn.innerText = `PROCESSING...`;
            msgBox.classList.add('hidden');

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMsg('ACCESS GRANTED.', 'text-[#a855f7]', 'bg-[#a855f7]/10');
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
                    if (error) throw error;
                    showMsg('IDENTITY ESTABLISHED.', 'text-[#a855f7]', 'bg-[#a855f7]/10');
                    setTimeout(() => toggleMode(), 2000);
                }
            } catch (error) {
                showMsg('ERROR: ' + error.message, 'text-red-500', 'bg-red-500/10');
            } finally {
                if(btn.innerText === 'PROCESSING...') btn.innerText = isLogin ? 'Initialize Connection' : 'Establish Identity';
            }
        }

        function showMsg(text, textColor, bgColor) {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerText = text;
            msgBox.className = `text-[10px] font-bold text-center mt-4 p-2 rounded-lg tracking-widest uppercase ${textColor} ${bgColor} border border-current`;
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
