<head>

    <style>
        :root {
            --bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');
            --poster-url: url('https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?q=80&w=400');
            --bg-overlay: rgba(5, 5, 8, 0.9);
            --card-bg: rgba(15, 15, 20, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000;
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
            transition: background-image 0.8s ease;
        }

        .bg-overlay {
            position: absolute; inset: 0;
            background: var(--bg-overlay);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: -1; transition: background 0.8s ease;
        }

        /* The Nexus Glass Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--card-border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Movie / Anime Poster Header */
        .theme-poster-box {
            width: 100%; height: 160px; border-radius: 20px; margin-bottom: 24px;
            background-image: var(--poster-url); background-size: cover; background-position: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 15px 40px var(--accent-glow);
            position: relative; overflow: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .theme-poster-box::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--card-bg) 0%, transparent 100%);
        }

        /* Agency Level Inputs */
        .input-peer {
            width: 100%; background: rgba(0,0,0,0.4); color: #fff;
            border: 1px solid var(--card-border); border-radius: 14px;
            padding: 16px 18px; font-size: 14px; outline: none; transition: all 0.3s ease;
            margin-bottom: 16px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .input-peer:focus { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow), inset 0 2px 10px rgba(0,0,0,0.4); background: rgba(0,0,0,0.7); }
        .input-peer::placeholder { color: rgba(255,255,255,0.3); font-weight: 300; letter-spacing: 1px; }

        /* The Action Button (Glowing Engine) */
        .btn-glow {
            background: var(--accent); color: #fff; font-weight: 900;
            box-shadow: 0 10px 30px var(--accent-glow); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            height: 60px; position: relative; overflow: hidden;
        }
        .btn-glow::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); transition: all 0.5s ease;
        }
        .btn-glow:hover::before { left: 150%; }
        .btn-glow:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px var(--accent-glow); filter: brightness(1.2); }
        .btn-glow:active { transform: translateY(1px) scale(0.98); }

        .action-gif { height: 35px; width: auto; object-fit: contain; mix-blend-mode: screen; }

        /* Netflix-style Theme Studio */
        .theme-studio {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(30px);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .theme-studio.active { opacity: 1; pointer-events: auto; }
        
        /* Custom Scrollbar for 100+ Themes */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .theme-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 16px; max-height: 65vh; overflow-y: auto; width: 100%; max-w: 900px; padding: 10px; 
        }
        
        .theme-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 10px; text-align: left; transition: all 0.4s; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-5px) scale(1.03); border-color: var(--accent); box-shadow: 0 10px 20px var(--accent-glow); }
        
        /* Category Filters */
        .filter-btn {
            padding: 8px 16px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease; cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

    </style>
</head>

        let currentThemeId = 'ayanokoji'; 

        function initThemeEngine() {
            renderThemes('All');
            const saved = localStorage.getItem('vertex_theme') || 'ayanokoji';
            if(themes[saved]) applyTheme(saved);
            else if(saved === 'custom') loadCustomTheme();
        }

        // The Category Filter Engine
        function renderThemes(filterCat) {
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            
            for (const [id, data] of Object.entries(themes)) {
                if (filterCat !== 'All' && data.cat !== filterCat && !data.cat.includes(filterCat)) continue;
                
                const btn = document.createElement('div');
                btn.className = 'theme-btn group';
                btn.onclick = () => applyTheme(id);
                btn.innerHTML = `
                    <div class="w-full h-24 rounded-xl mb-3 bg-cover bg-center border border-white/10 group-hover:border-[${data.accent}] relative overflow-hidden" style="background-image: url('${data.poster}');">
                        <div class="absolute inset-0 bg-black/50 group-hover:bg-black/10 transition-all duration-300"></div>
                        <div class="absolute bottom-2 left-2 flex gap-1">
                            <span class="w-2.5 h-2.5 rounded-full shadow-[0_0_10px_${data.accent}]" style="background: ${data.accent}"></span>
                        </div>
                    </div>
                    <div class="text-[9px] uppercase font-black text-[var(--accent)] tracking-widest">${data.cat}</div>
                    <div class="text-sm font-black text-white mt-0.5">${data.name}</div>
                `;
                grid.appendChild(btn);
            }
        }

        function filterThemes(cat, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderThemes(cat);
        }

        function applyTheme(id) {
            if(!themes[id]) return;
            currentThemeId = id;
            const data = themes[id];
            const root = document.documentElement;
            
            root.style.setProperty('--bg-url', `url('${data.bg}')`);
            root.style.setProperty('--poster-url', `url('${data.poster}')`);
            root.style.setProperty('--bg-overlay', data.overlay);
            root.style.setProperty('--accent', data.accent);
            root.style.setProperty('--accent-glow', `${data.accent}80`);
            
            document.getElementById('cardThemeCat').innerText = data.cat;
            document.getElementById('cardThemeName').innerText = data.name;

            localStorage.setItem('vertex_theme', id);
            closeThemeStudio();
        }

        function handleCustomUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                localStorage.setItem('vertex_custom_bg', dataUrl);
                localStorage.setItem('vertex_theme', 'custom');
                loadCustomTheme();
            };
            reader.readAsDataURL(file);
        }

        function loadCustomTheme() {
            const savedImg = localStorage.getItem('vertex_custom_bg');
            if(!savedImg) return;
            const root = document.documentElement;
            root.style.setProperty('--bg-url', `url('${savedImg}')`);
            root.style.setProperty('--poster-url', `url('${savedImg}')`);
            root.style.setProperty('--bg-overlay', 'rgba(0,0,0,0.8)');
            root.style.setProperty('--accent', '#a855f7');
            
            document.getElementById('cardThemeCat').innerText = 'Custom';
            document.getElementById('cardThemeName').innerText = 'Personalized Base';
            closeThemeStudio();
        }

        function openThemeStudio() { document.getElementById('themeStudio').classList.add('active'); }
        function closeThemeStudio() { document.getElementById('themeStudio').classList.remove('active'); }

        function toggleMode() {
            isLogin = !isLogin;
            const nameInput = document.getElementById('nameInput');
            const submitBtn = document.getElementById('submitBtn');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isLogin) {
                nameInput.classList.add('hidden'); nameInput.removeAttribute('required');
                submitBtn.innerHTML = '<span id="btnText">Initialize Connection</span>';
                toggleText.innerText = "Unregistered entity?"; toggleBtn.innerText = 'Request Access';
            } else {
                nameInput.classList.remove('hidden'); nameInput.setAttribute('required', 'true');
                submitBtn.innerHTML = '<span id="btnText">Establish Identity</span>';
                toggleText.innerText = "Authorized?"; toggleBtn.innerText = 'Return';
            }
        }

        // THE ACTION ENGINE 2.0
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');
            
            const activeActionGif = (themes[currentThemeId] && themes[currentThemeId].actionGif) 
                ? themes[currentThemeId].actionGif 
                : 'https://media.tenor.com/On7kvXhzmL4AAAAi/loading-gif.gif'; // Fallback

            // EXECUTE ACTION ANIMATION (Rasengan, Bat Signal, etc.)
            btn.innerHTML = `<img src="${activeActionGif}" class="action-gif" onerror="this.src='https://media.tenor.com/On7kvXhzmL4AAAAi/loading-gif.gif'" alt="Action"> <span class="tracking-widest">EXECUTING...</span>`;
            msgBox.classList.add('hidden');

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMsg('ACCESS GRANTED.', 'text-[var(--accent)]', 'bg-[var(--accent)]/10');
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
                    if (error) throw error;
                    showMsg('IDENTITY ESTABLISHED.', 'text-[var(--accent)]', 'bg-[var(--accent)]/10');
                    setTimeout(() => toggleMode(), 2000);
                }
            } catch (error) {
                showMsg('ERROR: ' + error.message, 'text-red-500', 'bg-red-500/10');
                btn.innerHTML = isLogin ? '<span>Initialize Connection</span>' : '<span>Establish Identity</span>';
            }
        }

        function showMsg(text, textColor, bgColor) {
            const msgBox = document.getElementById('msgBox');
            msgBox.className = `text-[10px] font-black text-center mt-5 p-3 rounded-xl uppercase tracking-widest border border-current backdrop-blur-md ${textColor} ${bgColor}`;
            msgBox.innerText = text; msgBox.classList.remove('hidden');
        }

        window.onload = initThemeEngine;
    </script>
</body>
</html>
