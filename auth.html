<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX NEXUS | Identity Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS VARIABLE ARCHITECTURE (Theme Engine Core) */
        :root {
            --bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop');
            --bg-overlay: rgba(10, 10, 12, 0.85);
            --card-bg: rgba(20, 20, 25, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: #000;
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bg-overlay {
            position: absolute; inset: 0;
            background: var(--bg-overlay);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            z-index: -1; transition: background 0.8s ease;
        }

        /* DYNAMIC LOGO SYSTEM */
        .nexus-logo {
            font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(to right, var(--text-main), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
        }

        /* PREMIUM GLASSMORPHISM CARD */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--card-border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* CIRCULAR AVATAR SYSTEM */
        .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto; }
        .avatar-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 60%, var(--accent) 100%);
            animation: spinRing 3s linear infinite;
        }
        .avatar-inner {
            position: absolute; inset: 2px; border-radius: 50%; overflow: hidden;
            border: 2px solid var(--card-border); background: var(--bg-overlay);
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* FLOATING LABEL INPUTS (Agency Level) */
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-peer {
            width: 100%; background: rgba(255,255,255,0.03); color: var(--text-main);
            border: 1px solid var(--card-border); border-radius: 12px;
            padding: 16px 16px 10px 16px; font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .input-peer:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); background: rgba(0,0,0,0.2); }
        .input-label {
            position: absolute; left: 16px; top: 14px; color: var(--text-muted);
            font-size: 14px; transition: all 0.3s ease; pointer-events: none;
        }
        .input-peer:focus ~ .input-label, .input-peer:not(:placeholder-shown) ~ .input-label {
            transform: translateY(-8px) scale(0.75); transform-origin: left; color: var(--accent);
        }

        /* GLOWING BUTTON */
        .btn-glow {
            background: var(--accent); color: #fff; font-weight: 700;
            box-shadow: 0 10px 20px var(--accent-glow); transition: all 0.3s ease;
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 15px 30px var(--accent-glow); filter: brightness(1.2); }
        .btn-glow:active { transform: translateY(1px); }

        /* THEME STUDIO MODAL */
        .theme-studio {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .theme-studio.active { opacity: 1; pointer-events: auto; }
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-height: 70vh; overflow-y: auto; padding-right: 10px; }
        .theme-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px; text-align: left; transition: all 0.3s; cursor: pointer;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

        /* Staggered Animations */
        .stag { opacity: 0; animation: fadeUp 0.6s forwards; }
        .d-1 { animation-delay: 0.1s; } .d-2 { animation-delay: 0.2s; } .d-3 { animation-delay: 0.3s; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    
    <div class="bg-overlay"></div>

    <!-- HEADER / BRANDING -->
    <div class="absolute top-6 left-6 flex items-center gap-3 z-40 cursor-pointer" onclick="window.location.href='/index.html'">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl text-white" style="background: var(--accent); box-shadow: 0 0 15px var(--accent-glow);">V</div>
        <span class="text-2xl nexus-logo">VERTEX</span>
    </div>

    <!-- THEME STUDIO TRIGGER -->
    <button onclick="openThemeStudio()" class="absolute top-6 right-6 z-40 bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-all flex items-center gap-2">
        <span class="w-2 h-2 rounded-full animate-pulse" style="background: var(--accent);"></span> Theme Studio
    </button>

    <!-- AUTHENTICATION CARD -->
    <div class="glass-card w-full max-w-[400px] rounded-[2rem] p-8 md:p-10 relative z-10">
        
        <!-- DYNAMIC AVATAR -->
        <div class="avatar-container mb-8 stag d-1">
            <div class="avatar-ring"></div>
            <div class="avatar-inner">
                <img id="userAvatar" src="https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all duration-500" alt="Avatar">
            </div>
        </div>

        <div class="text-center mb-8 stag d-1">
            <h2 id="formTitle" class="text-2xl font-black tracking-tight mb-1">SYSTEM LOGIN</h2>
            <p id="formSubtitle" class="text-xs font-medium text-[var(--text-muted)]">Authenticate to enter Nexus.</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="stag d-2">
            
            <div id="nameField" class="input-group hidden">
                <input type="text" id="nameInput" class="input-peer" placeholder=" " autocomplete="name">
                <label class="input-label">Legal Name</label>
            </div>

            <div class="input-group">
                <input type="email" id="emailInput" class="input-peer" placeholder=" " required autocomplete="username">
                <label class="input-label">Network Email</label>
            </div>

            <div class="input-group">
                <input type="password" id="passwordInput" class="input-peer" placeholder=" " required autocomplete="current-password">
                <label class="input-label">Security Passcode</label>
            </div>

            <button type="submit" id="submitBtn" class="btn-glow w-full py-4 mt-2 rounded-xl text-[12px] uppercase tracking-widest flex justify-center items-center gap-2">
                Initialize Connection
            </button>
            
            <p id="msgBox" class="text-[10px] font-bold text-center hidden mt-4 p-3 rounded-lg uppercase tracking-widest border border-current"></p>
        </form>

        <div class="text-center text-[11px] mt-8 font-medium text-[var(--text-muted)] border-t border-white/10 pt-6 stag d-3">
            <span id="toggleText">Unregistered entity?</span> 
            <button onclick="toggleMode()" id="toggleBtn" class="font-bold ml-2 transition-colors uppercase tracking-widest" style="color: var(--accent);">Request Access</button>
        </div>
    </div>

    <!-- THEME STUDIO MODAL (100+ Scalable Engine) -->
    <div id="themeStudio" class="theme-studio">
        <div class="glass-card w-full max-w-3xl rounded-[2rem] p-8 relative flex flex-col max-h-[90vh]">
            <button onclick="closeThemeStudio()" class="absolute top-6 right-6 text-white/50 hover:text-white font-bold text-xl">✕</button>
            
            <div class="mb-6">
                <h2 class="text-2xl font-black tracking-widest">THEME STUDIO</h2>
                <p class="text-xs text-[var(--text-muted)] mt-1">Select your personalized neural environment.</p>
            </div>

            <div class="theme-grid custom-scrollbar" id="themeGrid">
                <!-- Javascript will populate themes here dynamically -->
            </div>
            
            <div class="mt-6 pt-4 border-t border-white/10 flex justify-between items-center">
                <label class="cursor-pointer bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs font-bold transition-all text-white flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Custom Background
                    <input type="file" id="customBg" accept="image/*" class="hidden" onchange="uploadCustomBg(event)">
                </label>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE BACKEND INTEGRATION
        const supabaseUrl = 'https://memwikauqfvctwbrgmgf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbXdpa2F1cWZ2Y3R3YnJnbWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njc4NDcsImV4cCI6MjEwNTE0Mzg0N30.f1MbDY5DGxaYwVnOBrN8N0ODWe9ZpYGmiL2NfvyIBCo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLogin = true;

        /* ==========================================
           100+ THEME ENGINE ARCHITECTURE 
           Add as many themes as you want here.
        ========================================== */
        const themes = {
            // A. Core Themes
            'midnight': { name: 'Midnight Nexus', cat: 'Core', bg: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000', overlay: 'rgba(10,10,12,0.85)', accent: '#a855f7' },
            'aurora': { name: 'Aurora Borealis', cat: 'Core', bg: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=2000', overlay: 'rgba(5,20,15,0.7)', accent: '#10b981' },
            'glass': { name: 'Liquid Glass', cat: 'Core', bg: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2000', overlay: 'rgba(255,255,255,0.1)', accent: '#3b82f6' },
            
            // B. Anime Inspired
            'shinobi': { name: 'Will of Fire (Ninja)', cat: 'Anime', bg: 'https://images.unsplash.com/photo-1471922694854-ff1b63b20054?q=80&w=2000', overlay: 'rgba(20,5,5,0.8)', accent: '#f97316' },
            'pirate': { name: 'Grand Line', cat: 'Anime', bg: 'https://images.unsplash.com/photo-1518331483807-f6abc0e1f744?q=80&w=2000', overlay: 'rgba(5,15,30,0.8)', accent: '#ef4444' },
            'shinigami': { name: 'Death Realm', cat: 'Anime', bg: 'https://images.unsplash.com/photo-1509343256512-d77a5cb3791d?q=80&w=2000', overlay: 'rgba(0,0,0,0.9)', accent: '#dc2626' },
            
            // C. Cinematic / Hollywood
            'knight': { name: 'Gotham Knight', cat: 'Cinematic', bg: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2000', overlay: 'rgba(5,5,8,0.85)', accent: '#eab308' },
            'krypton': { name: 'Man of Tomorrow', cat: 'Cinematic', bg: 'https://images.unsplash.com/photo-1494253109108-2e30c049369b?q=80&w=2000', overlay: 'rgba(5,20,50,0.7)', accent: '#ef4444' },
            
            // D. Student Lifestyle
            'study': { name: 'Deep Focus', cat: 'Lifestyle', bg: 'https://images.unsplash.com/photo-1456324504439-367cee3b3c32?q=80&w=2000', overlay: 'rgba(20,20,20,0.8)', accent: '#8b5cf6' },
            'code': { name: 'Digital Matrix', cat: 'Lifestyle', bg: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2000', overlay: 'rgba(0,10,0,0.85)', accent: '#22c55e' },
            
            // E. Experimental
            'cosmic': { name: 'Cosmic Portal', cat: 'Experimental', bg: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000', overlay: 'rgba(15,5,30,0.8)', accent: '#d946ef' },
            'minimal': { name: 'Minimal Luxury', cat: 'Experimental', bg: 'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?q=80&w=2000', overlay: 'rgba(250,250,250,0.85)', accent: '#000000' }
        };

        // Initialize Engine
        function initThemeEngine() {
            const grid = document.getElementById('themeGrid');
            for (const [id, data] of Object.entries(themes)) {
                const btn = document.createElement('div');
                btn.className = 'theme-btn group';
                btn.onclick = () => applyTheme(id);
                btn.innerHTML = `
                    <div class="w-full h-16 rounded-lg mb-3 bg-cover bg-center border border-white/10 group-hover:border-[${data.accent}]" style="background-image: url('${data.bg}');"></div>
                    <div class="text-[10px] uppercase font-bold text-[var(--text-muted)]">${data.cat}</div>
                    <div class="text-xs font-bold text-white">${data.name}</div>
                    <div class="flex items-center gap-2 mt-2">
                        <div class="w-3 h-3 rounded-full" style="background: ${data.accent}"></div>
                    </div>
                `;
                grid.appendChild(btn);
            }
            
            // Load saved theme
            const saved = localStorage.getItem('vertex_theme') || 'midnight';
            if(themes[saved]) applyTheme(saved);
            else if (saved === 'custom') loadCustomTheme();
        }

        function applyTheme(id) {
            if(!themes[id]) return;
            const root = document.documentElement;
            root.style.setProperty('--bg-url', `url('${themes[id].bg}')`);
            root.style.setProperty('--bg-overlay', themes[id].overlay);
            root.style.setProperty('--accent', themes[id].accent);
            root.style.setProperty('--accent-glow', `${themes[id].accent}80`);
            
            // Logic for Minimal light theme text contrast
            if(id === 'minimal' || id === 'glass') {
                root.style.setProperty('--text-main', '#000000');
                root.style.setProperty('--card-bg', 'rgba(255,255,255,0.4)');
            } else {
                root.style.setProperty('--text-main', '#ffffff');
                root.style.setProperty('--card-bg', 'rgba(20,20,25,0.5)');
            }

            localStorage.setItem('vertex_theme', id);
            closeThemeStudio();
        }

        // Custom User Image Upload Engine
        function uploadCustomBg(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                localStorage.setItem('vertex_custom_bg', dataUrl);
                localStorage.setItem('vertex_theme', 'custom');
                loadCustomTheme();
            };
            reader.readAsDataURL(file);
        }

        function loadCustomTheme() {
            const savedImg = localStorage.getItem('vertex_custom_bg');
            if(!savedImg) return;
            const root = document.documentElement;
            root.style.setProperty('--bg-url', `url('${savedImg}')`);
            root.style.setProperty('--bg-overlay', 'rgba(0,0,0,0.7)');
            root.style.setProperty('--accent', '#a855f7');
            root.style.setProperty('--text-main', '#ffffff');
            closeThemeStudio();
        }

        // Modal Controls
        function openThemeStudio() { document.getElementById('themeStudio').classList.add('active'); }
        function closeThemeStudio() { document.getElementById('themeStudio').classList.remove('active'); }

        // Auth Form Toggle
        function toggleMode() {
            isLogin = !isLogin;
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const formTitle = document.getElementById('formTitle');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');
            const passInput = document.getElementById('passwordInput');
            const nameInput = document.getElementById('nameInput');

            if (isLogin) {
                nameField.classList.add('hidden'); nameInput.removeAttribute('required');
                submitBtn.innerText = 'Initialize Connection'; formTitle.innerText = 'SYSTEM LOGIN';
                toggleText.innerText = "Unregistered entity?"; toggleBtn.innerText = 'Request Access';
                passInput.setAttribute('autocomplete', 'current-password');
            } else {
                nameField.classList.remove('hidden'); nameInput.setAttribute('required', 'true');
                submitBtn.innerText = 'Establish Identity'; formTitle.innerText = 'NEW CLEARANCE';
                toggleText.innerText = "Authorized?"; toggleBtn.innerText = 'Return';
                passInput.setAttribute('autocomplete', 'new-password');
            }
        }

        // Supabase Auth Handler
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');

            btn.innerText = `PROCESSING...`; msgBox.classList.add('hidden');

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMsg('ACCESS GRANTED. SYNCING...', 'text-[var(--accent)]', 'bg-[var(--accent)]/10 border-[var(--accent)]/50');
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
                    if (error) throw error;
                    showMsg('IDENTITY ESTABLISHED. VERIFY EMAIL.', 'text-[var(--accent)]', 'bg-[var(--accent)]/10 border-[var(--accent)]/50');
                    setTimeout(() => toggleMode(), 2000);
                }
            } catch (error) {
                showMsg('ERROR: ' + error.message, 'text-red-500', 'bg-red-500/10 border-red-500/50');
            } finally {
                if(btn.innerText === 'PROCESSING...') btn.innerText = isLogin ? 'Initialize Connection' : 'Establish Identity';
            }
        }

        function showMsg(text, textColor, bgColor) {
            const msgBox = document.getElementById('msgBox');
            msgBox.className = `text-[10px] font-bold text-center mt-4 p-3 rounded-lg uppercase tracking-widest border ${textColor} ${bgColor}`;
            msgBox.innerText = text; msgBox.classList.remove('hidden');
        }

        // Run Engine on load
        window.onload = initThemeEngine;
    </script>
</body>
</html>
