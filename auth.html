<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VERTEX | Premium Access</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=2000');
            --btn-color: #007AFF;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            background-image: var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            color: #fff; -webkit-font-smoothing: antialiased;
            transition: background-image 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Apple Vision Pro Style Frosted Glass */
        .apple-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .apple-input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; border-radius: 18px; padding: 18px 20px; font-size: 16px; font-weight: 500;
            outline: none; transition: all 0.3s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .apple-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .apple-input:focus { border-color: var(--btn-color); background: rgba(0,0,0,0.6); }

        .apple-btn {
            width: 100%; background: var(--btn-color); color: #ffffff;
            font-weight: 700; font-size: 16px; border-radius: 18px; padding: 18px;
            border: none; cursor: pointer; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .apple-btn:active { transform: scale(0.95); filter: brightness(0.8); }

        /* Full Screen Action Hologram */
        #cinematicOverlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #000000; /* Pure black for GIF blending */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #cinematicOverlay.active { opacity: 1; pointer-events: auto; }
        .action-gif { width: 100%; height: 100%; object-fit: contain; transform: scale(1.1); }

        /* Bottom Theme Sheet */
        .theme-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 40px 40px 0 0; padding: 24px 20px 40px 20px; z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.15);
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .theme-sheet.active { transform: translateY(0); }
        
        .theme-btn { width: 70px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .theme-icon {
            width: 60px; height: 60px; border-radius: 50%; background-size: cover; background-position: center;
            border: 2px solid transparent; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .theme-btn:active .theme-icon { transform: scale(0.9); }
        .theme-btn.active-theme .theme-icon { border: 3px solid var(--btn-color); transform: scale(1.05); }
        
        .hide { display: none !important; }
        .no-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 relative">

    <div class="absolute top-10 left-8 z-40">
        <span class="text-3xl font-black tracking-tighter text-white drop-shadow-xl">VERTEX</span>
    </div>

    <!-- Theme Trigger -->
    <button onclick="toggleThemeSheet(true)" class="absolute top-10 right-8 z-40 bg-black/40 backdrop-blur-xl border border-white/20 px-5 py-2.5 rounded-full text-xs font-bold text-white shadow-lg flex items-center gap-2 hover:bg-black/60 transition-colors">
        <div class="w-3 h-3 rounded-full shadow-[0_0_8px_var(--btn-color)]" style="background: var(--btn-color);"></div> Themes
    </button>

    <!-- App Login Card -->
    <div class="apple-glass w-full max-w-[400px] p-8 md:p-10 relative z-10 mt-12">
        <div class="mb-10">
            <h2 class="text-4xl font-black tracking-tight text-white mb-2">Access Hub</h2>
            <p class="text-sm font-medium text-gray-400">Initialize your neural workspace</p>
        </div>

        <!-- Strict NO-FORM layout to prevent browser reload bugs -->
        <div class="space-y-5">
            <input type="text" id="nameInput" class="apple-input" placeholder="Enter Alias (e.g. Agent L)" value="">
            
            <button type="button" onclick="launchSystem()" class="apple-btn mt-4">
                Launch System
            </button>
        </div>
    </div>

    <!-- The Action Hologram -->
    <div id="cinematicOverlay">
        <img id="actionGifEl" class="action-gif" src="" alt="Action Animation">
        <div class="absolute bottom-20 text-[var(--btn-color)] text-sm font-black tracking-widest uppercase animate-pulse drop-shadow-[0_0_10px_var(--btn-color)]">Authenticating Bypass...</div>
    </div>

    <!-- Theme Universe Bottom Sheet -->
    <div id="themeSheet" class="theme-sheet">
        <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-8 cursor-pointer" onclick="toggleThemeSheet(false)"></div>
        <div class="flex justify-between items-center mb-6 px-4">
            <h3 class="text-xl font-black text-white tracking-tight">Select Universe</h3>
            <button type="button" onclick="toggleThemeSheet(false)" class="text-sm font-bold bg-white/10 px-4 py-2 rounded-full text-[var(--btn-color)]">Close</button>
        </div>
        <div class="flex gap-5 overflow-x-auto pb-4 no-scroll px-4" id="themeContainer"></div>
    </div>

    <script>
        /* PRO THEME ENGINE */
        const themes = {
            'default': { name: 'Apple', bg: 'https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=2000', icon: 'https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=200', actionGif: 'https://media.tenor.com/On7kvXhzmL4AAAAi/loading-gif.gif', btnColor: '#007AFF' },
            'spiderman': { name: 'Spidey', bg: 'https://images.alphacoders.com/946/946124.jpg', icon: 'https://i.pinimg.com/736x/89/3b/b1/893bb127ffde61b7fcd2649b3806fb60.jpg', actionGif: 'https://media.tenor.com/bK1zE3e6zF0AAAAi/spiderman-web.gif', btnColor: '#dc2626' },
            'batman': { name: 'Batman', bg: 'https://images.alphacoders.com/123/1230114.jpg', icon: 'https://i.pinimg.com/736x/1a/10/37/1a10375dc162dc4a8f9446f04c636cb0.jpg', actionGif: 'https://media.tenor.com/PZt7H55-P5gAAAAi/batman-bat-signal.gif', btnColor: '#eab308' },
            'superman': { name: 'Superman', bg: 'https://images.alphacoders.com/264/264509.jpg', icon: 'https://i.pinimg.com/736x/bc/50/be/bc50be25d8d09cb2d2c125608cc0edde.jpg', actionGif: 'https://media.tenor.com/pZ2D8K5Z_2gAAAAi/superman-laser.gif', btnColor: '#2563eb' },
            'naruto': { name: 'Naruto', bg: 'https://images2.alphacoders.com/131/1314488.jpeg', icon: 'https://i.pinimg.com/736x/db/51/97/db51978d38bf3b0d2381f96e4ec6f284.jpg', actionGif: 'https://media.tenor.com/71233F62mXMAAAAi/naruto-rasengan.gif', btnColor: '#f97316' },
            'onepiece': { name: 'One Piece', bg: 'https://images.alphacoders.com/132/1321049.jpeg', icon: 'https://i.pinimg.com/736x/95/92/7f/95927fa83315a6b0c6a5fc1a6cebf257.jpg', actionGif: 'https://media.tenor.com/39I7m8rFq_4AAAAi/luffy-gear.gif', btnColor: '#ef4444' },
            'f1race': { name: 'F1 Racing', bg: 'https://images.unsplash.com/photo-1534484080702-861cda411808?q=80&w=2000', icon: 'https://i.pinimg.com/736x/cb/09/b7/cb09b7c897f7422f2187bf59e6f30ba4.jpg', actionGif: 'https://media.tenor.com/4q-v1lA-KfkAAAAi/f1-formula-one.gif', btnColor: '#ef4444' },
            'cricket': { name: 'Cricket', bg: 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000', icon: 'https://i.pinimg.com/736x/d6/11/a9/d611a938c4d21e84df2d1bce4750e6ad.jpg', actionGif: 'https://media.tenor.com/83p8vjTjP4MAAAAi/cricket-ball.gif', btnColor: '#0ea5e9' },
            'football': { name: 'Football', bg: 'https://images.unsplash.com/photo-1518605368461-1ee7c688e104?q=80&w=2000', icon: 'https://i.pinimg.com/736x/ea/5e/51/ea5e51cd55516a24ed4ea52e00e008eb.jpg', actionGif: 'https://media.tenor.com/Qe1v8p-q-P8AAAAi/ronaldo-siiu.gif', btnColor: '#22c55e' }
        };

        let currentThemeId = 'default';

        document.addEventListener('DOMContentLoaded', () => {
            renderThemeSelector();
            applyTheme(localStorage.getItem('vertex_theme') || 'default');
        });

        function renderThemeSelector() {
            const container = document.getElementById('themeContainer');
            for (const [id, data] of Object.entries(themes)) {
                const btn = document.createElement('div');
                btn.className = `theme-btn ${id === currentThemeId ? 'active-theme' : ''}`;
                btn.id = `theme-btn-${id}`;
                btn.onclick = () => applyTheme(id);
                btn.innerHTML = `
                    <div class="theme-icon" style="background-image: url('${data.icon}');"></div>
                    <span class="text-[11px] font-bold text-gray-400 tracking-wide">${data.name}</span>
                `;
                container.appendChild(btn);
            }
        }

        function applyTheme(id) {
            if (!themes[id]) id = 'default';
            currentThemeId = id;
            const data = themes[id];
            
            document.documentElement.style.setProperty('--bg-image', `url('${data.bg}')`);
            document.documentElement.style.setProperty('--btn-color', data.btnColor);
            
            document.querySelectorAll('.theme-btn').forEach(el => el.classList.remove('active-theme'));
            const activeBtn = document.getElementById(`theme-btn-${id}`);
            if (activeBtn) activeBtn.classList.add('active-theme');

            localStorage.setItem('vertex_theme', id);
        }

        function toggleThemeSheet(show) {
            document.getElementById('themeSheet').classList.toggle('active', show);
        }

        function launchSystem() {
            // 1. Save dummy session
            const nameInput = document.getElementById('nameInput');
            localStorage.setItem('vertex_dummy_user', nameInput.value || 'Agent L');

            // 2. Play Theme Action (Spiderman, Naruto etc.)
            const overlay = document.getElementById('cinematicOverlay');
            document.getElementById('actionGifEl').src = themes[currentThemeId].actionGif;
            overlay.classList.add('active');

            // 3. CACHE BUSTER REDIRECT (This fixes the "Restart" bug permanently)
            setTimeout(() => {
                const cacheBuster = new Date().getTime();
                window.location.href = `dashboard.html?v=${cacheBuster}`;
            }, 2000); 
        }
    </script>
</body>
</html>
