<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX | Theme Showcase Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent: #3b82f6; /* Superman Blue Default */
            --bg-dark: #0f111a;
            --glass-panel: rgba(25, 28, 41, 0.7);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 60%);
            transition: all 0.5s ease;
        }

        /* Glassmorphism Panels */
        .glass-box {
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        /* Center Character Glow & Float */
        .mascot-container {
            position: relative;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .ground-glow {
            width: 300px; height: 30px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.5;
            margin: -20px auto 0;
            transform: rotateX(60deg);
            transition: background 0.5s ease;
        }

        /* Progress Bars */
        .stat-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .stat-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent);
            transition: width 1s ease, background 0.5s ease, box-shadow 0.5s ease;
        }

        /* Voice Control Wave */
        .voice-wave {
            width: 100%; height: 40px;
            background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/858/wave.svg') center/cover;
            opacity: 0.5; filter: drop-shadow(0 0 5px var(--accent));
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row p-4 md:p-6 gap-6 relative">

    <!-- THEME SWITCHER (Top Right) -->
    <div class="absolute top-6 right-6 z-50 flex gap-3 bg-black/40 p-2 rounded-full border border-white/10 backdrop-blur-md">
        <button onclick="changeTheme('superman')" class="w-8 h-8 rounded-full bg-blue-600 border-2 border-transparent hover:border-white transition-all"></button>
        <button onclick="changeTheme('spiderman')" class="w-8 h-8 rounded-full bg-red-600 border-2 border-transparent hover:border-white transition-all"></button>
        <button onclick="changeTheme('naruto')" class="w-8 h-8 rounded-full bg-orange-500 border-2 border-transparent hover:border-white transition-all"></button>
        <button onclick="changeTheme('batman')" class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-transparent hover:border-white transition-all"></button>
    </div>

    <!-- LEFT SIDEBAR (Navigation & Voice) -->
    <aside class="glass-box w-full md:w-72 h-full flex flex-col p-6 z-10 hidden md:flex">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-[0_0_15px_var(--accent)]" style="background: var(--accent);">V</div>
            <span class="text-2xl font-black tracking-widest">VERTEX</span>
        </div>

        <nav class="flex-1 space-y-2">
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl font-bold text-sm bg-white/5 border-l-4" style="border-color: var(--accent);">
                <i class="fa-solid fa-border-all text-[var(--accent)] w-6 text-center"></i> Nexus Dashboard
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl font-bold text-sm text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-plug w-6 text-center"></i> Integration Hub
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl font-bold text-sm text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-calendar-check w-6 text-center"></i> Timeline
            </a>
        </nav>

        <!-- Voice Control Widget (From Reference Image) -->
        <div class="mt-auto bg-black/40 rounded-2xl p-5 border border-white/5 relative overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <h4 class="font-bold text-sm">AI Agent</h4>
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            </div>
            <div class="voice-wave mb-4"></div>
            <button class="w-full py-3 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(0,0,0,0.3)]" style="background: var(--accent);">
                <i class="fa-solid fa-microphone"></i> Hold to Speak
            </button>
        </div>
    </aside>

    <!-- CENTER STAGE (Theme Mascot Showcase) -->
    <main class="flex-1 h-full flex flex-col items-center justify-center relative z-0">
        
        <!-- Header Text -->
        <div class="absolute top-4 left-4 md:left-10 text-left w-full">
            <div class="flex items-center gap-3">
                <h1 id="themeTitle" class="text-4xl md:text-5xl font-black tracking-tight">Superman</h1>
                <i class="fa-solid fa-shield text-[var(--accent)] text-2xl"></i>
            </div>
            <p class="text-gray-400 text-sm font-semibold tracking-widest uppercase mt-2">Active Environment</p>
        </div>

        <!-- Dynamic Character Image -->
        <div class="mascot-container mt-10">
            <!-- Images are transparent PNGs/GIFs for 3D effect -->
            <img id="mascotImg" src="https://images.alphacoders.com/264/264509.jpg" class="h-[40vh] md:h-[60vh] object-contain drop-shadow-[0_0_30px_rgba(255,255,255,0.2)]" style="border-radius: 20px; mix-blend-mode: screen;" alt="Mascot">
            <div class="ground-glow"></div>
        </div>

        <!-- Bottom Controls (Overview / Power) -->
        <div class="absolute bottom-10 flex gap-4 bg-black/40 p-2 rounded-full border border-white/10 backdrop-blur-md">
            <button class="px-6 py-2 rounded-full text-sm font-bold bg-white/10 text-white">Overview</button>
            <button class="px-6 py-2 rounded-full text-sm font-bold text-gray-400 hover:text-white">Modules</button>
        </div>
    </main>

    <!-- RIGHT SIDEBAR (Learning MRI / Stats) -->
    <aside class="glass-box w-full md:w-80 h-full p-6 md:p-8 flex flex-col justify-center gap-8 z-10">
        
        <div class="stat-block">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Focus Level</span>
                <span class="text-xl font-black">90%</span>
            </div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 90%;"></div></div>
        </div>

        <div class="stat-block">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Knowledge Retention</span>
                <span class="text-xl font-black">100%</span>
            </div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 100%;"></div></div>
        </div>

        <div class="stat-block">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Speed & Accuracy</span>
                <span class="text-xl font-black">85%</span>
            </div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 85%;"></div></div>
        </div>

        <div class="stat-block">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Consistency</span>
                <span class="text-xl font-black">80%</span>
            </div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div>
        </div>

        <div class="stat-block">
            <div class="flex justify-between items-end mb-1">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Module Completion</span>
                <span class="text-xl font-black">98%</span>
            </div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 98%;"></div></div>
        </div>

    </aside>

    <script>
        // THEME ENGINE LOGIC
        const themeData = {
            'superman': {
                title: 'Superman',
                accent: '#3b82f6', // Blue
                img: 'https://media.tenor.com/pZ2D8K5Z_2gAAAAi/superman-laser.gif'
            },
            'spiderman': {
                title: 'Spider-Man',
                accent: '#ef4444', // Red
                img: 'https://media.tenor.com/bK1zE3e6zF0AAAAi/spiderman-web.gif'
            },
            'naruto': {
                title: 'Naruto',
                accent: '#f97316', // Orange
                img: 'https://media.tenor.com/71233F62mXMAAAAi/naruto-rasengan.gif'
            },
            'batman': {
                title: 'Batman',
                accent: '#eab308', // Yellow
                img: 'https://media.tenor.com/PZt7H55-P5gAAAAi/batman-bat-signal.gif'
            }
        };

        function changeTheme(themeKey) {
            const data = themeData[themeKey];
            const root = document.documentElement;
            
            // Change Colors
            root.style.setProperty('--accent', data.accent);
            
            // Change Text & Image
            document.getElementById('themeTitle').innerText = data.title;
            document.getElementById('mascotImg').src = data.img;

            // Change Ambient Background Glow
            document.body.style.backgroundImage = `radial-gradient(circle at 50% 50%, ${data.accent}22 0%, transparent 60%)`;
        }
    </script>
</body>
</html>
