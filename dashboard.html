<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VERTEX | App Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Variables will be dynamically updated by Theme Engine */
            --bg-image: url('https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=2000');
            --btn-color: #007AFF;
            --nav-bg: rgba(20, 20, 20, 0.85);
            --glass-bg: rgba(30, 30, 30, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --overlay-gradient: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.95) 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000; color: var(--text-main);
            margin: 0; padding: 0; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        }

        /* Dynamic Engine */
        #app-background {
            position: fixed; inset: 0; z-index: -2;
            background-image: var(--bg-image); background-size: cover; background-position: center;
            transition: background-image 0.5s ease;
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: -1;
            background: var(--overlay-gradient);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: background 0.5s ease;
        }

        /* Bento Grid Glass Panels */
        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease; color: var(--text-main);
        }
        .bento-card-small {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); border-radius: 24px;
            transition: all 0.2s ease; color: var(--text-main);
        }
        .bento-card-small:active { transform: scale(0.96); }

        .ios-toggle {
            position: relative; width: 44px; height: 24px;
            background: rgba(150,150,150,0.3); border-radius: 100px;
            cursor: pointer; transition: background 0.3s ease;
        }
        .ios-toggle.active { background: var(--btn-color); }
        .ios-toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 20px; height: 20px; background: #fff; border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ios-toggle.active::after { transform: translateX(20px); }

        /* Floating iOS Nav Bar */
        .bottom-nav-container {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 420px; z-index: 90;
        }
        .bottom-nav {
            background: var(--nav-bg); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .nav-btn {
            position: relative; width: 45px; height: 45px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); border-radius: 50%; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-btn.active { color: var(--text-main); background: rgba(150,150,150,0.15); transform: translateY(-4px); }
        .nav-btn i { font-size: 18px; transition: transform 0.3s ease; }
        .nav-btn.active i { color: var(--btn-color); transform: scale(1.1); filter: drop-shadow(0 0 8px var(--btn-color)); }
        
        .page-fade-enter { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .scroll-area { overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; }
        .scroll-area::-webkit-scrollbar { display: none; } 

        /* Theme Bottom Sheet */
        .theme-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 32px 32px 0 0; padding: 24px 16px 40px 16px; z-index: 100;
            border-top: 1px solid var(--glass-border);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .theme-sheet.active { transform: translateY(0); }
        .theme-btn { flex-shrink: 0; width: 75px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .theme-icon {
            width: 65px; height: 65px; border-radius: 50%; background-size: cover; background-position: center;
            border: 2px solid transparent; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .theme-btn:active .theme-icon { transform: scale(0.9); }
        .theme-btn.active-theme .theme-icon { border: 3px solid var(--btn-color); padding: 2px; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="app-background"></div>
    <div class="bg-overlay"></div>

    <div class="flex flex-col h-full w-full max-w-lg mx-auto relative z-10">
        
        <!-- Apple Style Top Header -->
        <header class="px-6 pt-14 pb-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img id="userAvatar" src="" class="w-12 h-12 rounded-full border-2 object-cover bg-black shadow-lg" style="border-color: var(--btn-color);" alt="Portfolio">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-black rounded-full"></div>
                </div>
                <div>
                    <h1 id="userName" class="text-xl font-black tracking-tight leading-tight" style="color: var(--text-main);">Agent</h1>
                    <p class="text-[11px] font-bold uppercase tracking-widest mt-0.5" style="color: var(--text-muted);">Level 1 Nexus</p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <!-- Theme Button Added Here -->
                <button onclick="toggleThemeSheet(true)" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors" style="color: var(--text-main); border: 1px solid var(--glass-border);">
                    <i class="fa-solid fa-palette text-sm"></i>
                </button>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-red-500/20 transition-colors" style="color: var(--text-main); border: 1px solid var(--glass-border);">
                    <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                </button>
            </div>
        </header>

        <!-- APP CONTENT ROOT -->
        <main id="app-content" class="flex-1 scroll-area px-6 pt-2"></main>
    </div>

    <!-- IOS BOTTOM NAVIGATION -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <div onclick="navigate('home')" id="nav-home" class="nav-btn active"><i class="fa-solid fa-border-all"></i></div>
            <div onclick="navigate('notes')" id="nav-notes" class="nav-btn"><i class="fa-solid fa-bolt"></i></div>
            <div onclick="navigate('scheduler')" id="nav-scheduler" class="nav-btn"><i class="fa-solid fa-calendar-check"></i></div>
            <div onclick="navigate('doubt')" id="nav-doubt" class="nav-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div onclick="navigate('integration')" id="nav-integration" class="nav-btn"><i class="fa-solid fa-plug"></i></div>
        </div>
    </div>

    <!-- THEME UNIVERSE SELECTOR -->
    <div id="themeSheet" class="theme-sheet">
        <div class="w-12 h-1.5 bg-gray-500/50 rounded-full mx-auto mb-6 cursor-pointer" onclick="toggleThemeSheet(false)"></div>
        <div class="flex justify-between items-center mb-4 px-2">
            <h3 class="text-xl font-black" style="color: var(--text-main);">Theme Universe</h3>
            <button type="button" onclick="toggleThemeSheet(false)" class="text-sm font-bold" style="color: var(--btn-color);">Done</button>
        </div>
        
        <div class="flex gap-4 overflow-x-auto pb-2 scroll-area px-2" id="themeContainer">
            <!-- Populated by JS -->
        </div>
    </div>

    <script>
        // 18+ THEMES DICTIONARY (Light, Dark, Anime, Superheroes)

            'dark': { name: 'OLED Dark', mode: 'dark', bg: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000', icon: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200', btnColor: '#ffffff' },
            'spiderman': { name: 'Spidey', mode: 'dark', bg: 'https://images.alphacoders.com/946/946124.jpg', icon: 'https://i.pinimg.com/736x/89/3b/b1/893bb127ffde61b7fcd2649b3806fb60.jpg', btnColor: '#dc2626' },

            'dragonball': { name: 'DBZ', mode: 'dark', bg: 'https://images4.alphacoders.com/973/973966.jpg', icon: 'https://i.pinimg.com/736x/43/64/00/436400a40d5885dcaf47321e9ecdb665.jpg', btnColor: '#f59e0b' },

            'cyberpunk': { name: 'Cyberpunk', mode: 'dark', bg: 'https://images.alphacoders.com/111/1110574.jpg', icon: 'https://images.alphacoders.com/111/1110574.jpg', btnColor: '#ec4899' },
            'matrix': { name: 'Matrix', mode: 'dark', bg: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2000', icon: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=200', btnColor: '#22c55e' },

            'football': { name: 'Football', mode: 'dark', bg: 'https://images.unsplash.com/photo-1518605368461-1ee7c688e104?q=80&w=2000', icon: 'https://i.pinimg.com/736x/ea/5e/51/ea5e51cd55516a24ed4ea52e00e008eb.jpg', btnColor: '#22c55e' }
        };

        const Views = {
            home: `
                <div class="page-fade-enter space-y-4">
                    <div class="bento-card p-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-[var(--btn-color)] rounded-full blur-[60px] opacity-20"></div>
                        <h3 class="text-xs font-bold text-[var(--btn-color)] uppercase tracking-widest mb-1">Learning MRI</h3>
                        <div class="text-4xl font-black mb-6" style="color: var(--text-main);">92% <span class="text-sm font-medium" style="color: var(--text-muted);">Retention</span></div>
                        <div class="flex gap-3">
                            <div class="flex-1 rounded-2xl p-4 border" style="background: rgba(0,0,0,0.2); border-color: var(--glass-border);">
                                <div class="text-xl font-bold mb-1" style="color: var(--text-main);">14</div>
                                <div class="text-[10px] uppercase tracking-wider font-bold" style="color: var(--text-muted);">Modules</div>
                            </div>
                            <div class="flex-1 rounded-2xl p-4 border" style="background: rgba(0,0,0,0.2); border-color: var(--glass-border);">

                            </div>
                        </div>
                    </div>
                    <div class="bento-card p-5 border-l-4" style="border-left-color: var(--btn-color);">
                        <div class="flex gap-4 items-center">
                            <div class="w-10 h-10 rounded-full bg-[var(--btn-color)]/20 flex items-center justify-center text-[var(--btn-color)]"><i class="fa-solid fa-brain"></i></div>
                            <div>
                                <h4 class="text-sm font-bold" style="color: var(--text-main);">AI Suggestion</h4>
                                <p class="text-xs mt-0.5" style="color: var(--text-muted);">Revise Quantum Physics today.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            notes: `
                <div class="page-fade-enter space-y-5">
                    <div class="text-center mb-8 mt-6">
                        <div class="inline-block p-5 rounded-full bg-[var(--btn-color)]/20 mb-4 shadow-[0_0_30px_var(--btn-color)]"><i class="fa-solid fa-bolt text-4xl text-[var(--btn-color)]"></i></div>
                        <h2 class="text-3xl font-black" style="color: var(--text-main);">AI Notes</h2>
                        <p class="text-sm mt-2" style="color: var(--text-muted);">Paste link to generate structured notes.</p>
                    </div>
                    <div class="bento-card p-2 flex items-center" style="background: rgba(0,0,0,0.3);">
                        <input type="text" placeholder="YouTube or PDF URL..." class="flex-1 bg-transparent border-none text-sm px-4 py-3 outline-none" style="color: var(--text-main);">
                        <button class="bg-[var(--btn-color)] text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold shadow-lg"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            `,
            scheduler: `
                <div class="page-fade-enter space-y-4">
                    <h2 class="text-2xl font-black mb-4" style="color: var(--text-main);">Timeline</h2>
                    <div class="bento-card p-5 flex items-center gap-4 bg-[var(--btn-color)]/10 border-[var(--btn-color)]/30">
                        <div class="w-14 h-14 rounded-full bg-[var(--btn-color)] text-white flex flex-col items-center justify-center shadow-[0_0_15px_var(--btn-color)]"><span class="text-xs font-black">NOW</span></div>
                        <div>
                            <h4 class="text-base font-bold" style="color: var(--text-main);">Math Integration</h4>
                            <p class="text-xs text-[var(--btn-color)] font-bold uppercase mt-1">In Progress</p>
                        </div>
                        <i class="fa-solid fa-play ml-auto text-[var(--btn-color)] text-xl"></i>
                    </div>
                </div>
            `,
            doubt: `
                <div class="page-fade-enter h-full flex flex-col items-center justify-center pt-16">
                    <div class="relative mb-6">
                        <div class="absolute inset-0 bg-[var(--btn-color)] blur-3xl opacity-30 rounded-full animate-pulse"></div>
                        <i class="fa-solid fa-wand-magic-sparkles text-6xl text-[var(--btn-color)] relative z-10"></i>
                    </div>
                    <h2 class="text-3xl font-black text-center mb-3" style="color: var(--text-main);">AI Agent</h2>
                    <p class="text-sm text-center px-6" style="color: var(--text-muted);">Your personal doubt solver is currently syncing with the mainframe.</p>
                </div>
            `,
            integration: `
                <div class="page-fade-enter space-y-6">
                    <div class="mb-4 mt-2">
                        <h2 class="text-3xl font-black tracking-tight" style="color: var(--text-main);">Nexus Hub</h2>
                        <p class="text-sm mt-1 font-medium" style="color: var(--text-muted);">Centralize your entire learning ecosystem</p>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-[var(--btn-color)] uppercase tracking-widest mb-3 px-1">Learning Platforms</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-yellow-500/10 text-yellow-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(234,179,8,0.2)]"><i class="fa-solid fa-atom"></i></div>
                                <div><h4 class="text-sm font-bold" style="color: var(--text-main);">PW</h4><p class="text-[10px] mt-0.5" style="color: var(--text-muted);">Lectures & Tests</p></div>
                                <button class="w-full mt-2 bg-[var(--btn-color)] text-white py-1.5 rounded-xl text-xs font-bold border border-[var(--btn-color)]">Active Sync</button>
                            </div>
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]"><i class="fa-brands fa-youtube"></i></div>
                                <div><h4 class="text-sm font-bold" style="color: var(--text-main);">YouTube</h4><p class="text-[10px] mt-0.5" style="color: var(--text-muted);">Edu Playlists</p></div>
                                <button class="w-full mt-2 bg-white/10 py-1.5 rounded-xl text-xs font-bold transition-colors" style="color: var(--text-main);">Connect</button>
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        let currentThemeId = 'default';

        function renderThemeSelector() {
            const container = document.getElementById('themeContainer');
            container.innerHTML = '';
            for (const [id, data] of Object.entries(themes)) {
                const btn = document.createElement('div');
                btn.className = `theme-btn ${id === currentThemeId ? 'active-theme' : ''}`;
                btn.id = `theme-btn-${id}`;
                btn.onclick = () => applyTheme(id);
                btn.innerHTML = `
                    <div class="theme-icon" style="background-image: url('${data.icon}');"></div>
                    <span class="text-[10px] font-bold text-center" style="color: var(--text-muted);">${data.name}</span>
                `;
                container.appendChild(btn);
            }
        }

        function applyTheme(id) {
            if (!themes[id]) id = 'dark';
            currentThemeId = id;
            const data = themes[id];
            const root = document.documentElement;

            // Apply Engine Logic (Light vs Dark adaptation)
            if (data.mode === 'light') {
                root.style.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.7)');
                root.style.setProperty('--glass-border', 'rgba(0, 0, 0, 0.1)');
                root.style.setProperty('--text-main', '#000000');
                root.style.setProperty('--text-muted', '#4b5563');
                root.style.setProperty('--nav-bg', 'rgba(255, 255, 255, 0.9)');
                root.style.setProperty('--overlay-gradient', 'linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.95) 100%)');
            } else {
                root.style.setProperty('--glass-bg', 'rgba(30, 30, 30, 0.6)');
                root.style.setProperty('--glass-border', 'rgba(255, 255, 255, 0.1)');
                root.style.setProperty('--text-main', '#ffffff');
                root.style.setProperty('--text-muted', '#9ca3af');
                root.style.setProperty('--nav-bg', 'rgba(20, 20, 20, 0.9)');
                
                // Pure dark logic for OLED
                if(id === 'dark') {
                    root.style.setProperty('--overlay-gradient', 'linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 100%)');
                } else {
                    root.style.setProperty('--overlay-gradient', 'linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.95) 100%)');
                }
            }

            root.style.setProperty('--bg-image', `url('${data.bg}')`);
            root.style.setProperty('--btn-color', data.btnColor);
            
            document.querySelectorAll('.theme-btn').forEach(el => el.classList.remove('active-theme'));
            const activeBtn = document.getElementById(`theme-btn-${id}`);
            if (activeBtn) activeBtn.classList.add('active-theme');

            localStorage.setItem('vertex_theme', id);
        }

        function toggleThemeSheet(show) {
            document.getElementById('themeSheet').classList.toggle('active', show);
        }

        function navigate(tab) {
            document.getElementById('app-content').innerHTML = Views[tab];
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        function initApp() {
            renderThemeSelector();
            const savedThemeId = localStorage.getItem('vertex_theme') || 'dark';
            applyTheme(savedThemeId);

            const rawName = localStorage.getItem('vertex_dummy_user') || 'Agent L';
            document.getElementById('userName').innerText = rawName.toUpperCase();
            document.getElementById('userAvatar').src = `https://api.dicebear.com/7.x/notionists/svg?seed=${rawName}&backgroundColor=transparent`;

            navigate('home');
        }

        function logout() { window.location.href = 'auth.html'; }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
