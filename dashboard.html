<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VERTEX | App Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=2000');
            --btn-color: #007AFF;
            --nav-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000; color: #fff;
            margin: 0; padding: 0; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        }

        #app-background {
            position: fixed; inset: 0; z-index: -2;
            background-image: var(--bg-image); background-size: cover; background-position: center;
            transition: background-image 0.8s ease;
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }

        .bento-card {
            background: rgba(30, 30, 30, 0.5); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }
        .bento-card-small {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); border-radius: 24px;
            transition: all 0.2s ease;
        }
        .bento-card-small:active { transform: scale(0.96); }

        .ios-toggle {
            position: relative; width: 44px; height: 24px;
            background: rgba(255,255,255,0.2); border-radius: 100px;
            cursor: pointer; transition: background 0.3s ease;
        }
        .ios-toggle.active { background: var(--btn-color); }
        .ios-toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 20px; height: 20px; background: #fff; border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ios-toggle.active::after { transform: translateX(20px); }

        .bottom-nav-container {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 420px; z-index: 100;
        }
        .bottom-nav {
            background: var(--nav-bg); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 100px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .nav-btn {
            position: relative; width: 45px; height: 45px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-btn.active { color: #fff; background: rgba(255,255,255,0.1); transform: translateY(-4px); }
        .nav-btn i { font-size: 18px; transition: transform 0.3s ease; }
        .nav-btn.active i { color: var(--btn-color); transform: scale(1.1); filter: drop-shadow(0 0 8px var(--btn-color)); }
        
        .page-fade-enter { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .scroll-area { overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; }
        .scroll-area::-webkit-scrollbar { display: none; } 
    </style>
</head>
<body>

    <div id="app-background"></div>
    <div class="bg-overlay"></div>

    <div class="flex flex-col h-full w-full max-w-lg mx-auto relative z-10">
        
        <header class="px-6 pt-14 pb-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img id="userAvatar" src="" class="w-12 h-12 rounded-full border-2 object-cover bg-black shadow-lg" style="border-color: var(--btn-color);" alt="Portfolio">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-black rounded-full"></div>
                </div>
                <div>
                    <h1 id="userName" class="text-xl font-black tracking-tight leading-tight text-white">Agent</h1>
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">Level 1 Nexus</p>
                </div>
            </div>
            
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white/60 hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
            </button>
        </header>

        <main id="app-content" class="flex-1 scroll-area px-6 pt-2"></main>
    </div>

    <!-- IOS BOTTOM NAVIGATION -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <div onclick="navigate('home')" id="nav-home" class="nav-btn active"><i class="fa-solid fa-border-all"></i></div>
            <div onclick="navigate('notes')" id="nav-notes" class="nav-btn"><i class="fa-solid fa-bolt"></i></div>
            <div onclick="navigate('scheduler')" id="nav-scheduler" class="nav-btn"><i class="fa-solid fa-calendar-check"></i></div>
            <div onclick="navigate('doubt')" id="nav-doubt" class="nav-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div onclick="navigate('integration')" id="nav-integration" class="nav-btn"><i class="fa-solid fa-plug"></i></div>
        </div>
    </div>

    <script>
        const themes = {
            'default': { bg: 'https://images.unsplash.com/photo-1695221370216-081498b5ee42?q=80&w=2000', btnColor: '#007AFF' },
            'spiderman': { bg: 'https://images.alphacoders.com/946/946124.jpg', btnColor: '#dc2626' },
            'batman': { bg: 'https://images.alphacoders.com/123/1230114.jpg', btnColor: '#eab308' },
            'superman': { bg: 'https://images.alphacoders.com/264/264509.jpg', btnColor: '#2563eb' },
            'naruto': { bg: 'https://images2.alphacoders.com/131/1314488.jpeg', btnColor: '#f97316' },
            'onepiece': { bg: 'https://images.alphacoders.com/132/1321049.jpeg', btnColor: '#ef4444' },
            'f1race': { bg: 'https://images.unsplash.com/photo-1534484080702-861cda411808?q=80&w=2000', btnColor: '#ef4444' },
            'cricket': { bg: 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000', btnColor: '#0ea5e9' },
            'football': { bg: 'https://images.unsplash.com/photo-1518605368461-1ee7c688e104?q=80&w=2000', btnColor: '#22c55e' }
        };

        const Views = {
            home: `
                <div class="page-fade-enter space-y-4">
                    <div class="bento-card p-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-[var(--btn-color)] rounded-full blur-[60px] opacity-20"></div>
                        <h3 class="text-xs font-bold text-[var(--btn-color)] uppercase tracking-widest mb-1">Learning MRI</h3>
                        <div class="text-4xl font-black text-white mb-6">92% <span class="text-sm font-medium text-gray-400">Retention</span></div>
                        <div class="flex gap-3">
                            <div class="flex-1 bg-black/50 rounded-2xl p-4 border border-white/5">
                                <div class="text-xl font-bold text-white mb-1">14</div>
                                <div class="text-[10px] uppercase tracking-wider text-gray-500 font-bold">Modules</div>
                            </div>
                            <div class="flex-1 bg-black/50 rounded-2xl p-4 border border-white/5">
                                <div class="text-xl font-bold text-white flex items-center gap-2">5 <i class="fa-solid fa-fire text-[var(--btn-color)] text-sm"></i></div>
                                <div class="text-[10px] uppercase tracking-wider text-gray-500 font-bold">Streak</div>
                            </div>
                        </div>
                    </div>
                    <div class="bento-card p-5 border-l-4" style="border-left-color: var(--btn-color);">
                        <div class="flex gap-4 items-center">
                            <div class="w-10 h-10 rounded-full bg-[var(--btn-color)]/20 flex items-center justify-center text-[var(--btn-color)]"><i class="fa-solid fa-brain"></i></div>
                            <div>
                                <h4 class="text-sm font-bold text-white">AI Suggestion</h4>
                                <p class="text-xs text-gray-400 mt-0.5">Revise Quantum Physics today.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            notes: `... (Kept identical to previous for brevity) ...`,
            scheduler: `... (Kept identical to previous for brevity) ...`,
            doubt: `... (Kept identical to previous for brevity) ...`,
            
            // 🔥 THE NEW ULTIMATE INTEGRATION HUB 🔥
            integration: `
                <div class="page-fade-enter space-y-6">
                    <div class="mb-4 mt-2">
                        <h2 class="text-3xl font-black tracking-tight">Nexus Hub</h2>
                        <p class="text-sm text-gray-400 mt-1 font-medium">Centralize your entire learning ecosystem</p>
                    </div>

                    <!-- 1. EDTECH PLATFORMS SECTION (The Masterstroke) -->
                    <div>
                        <h3 class="text-xs font-bold text-[var(--btn-color)] uppercase tracking-widest mb-3 px-1">Learning Platforms</h3>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <!-- Physics Wallah -->
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-yellow-500/10 text-yellow-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                                    <i class="fa-solid fa-atom"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white">PW</h4>
                                    <p class="text-[10px] text-gray-400 mt-0.5">Lectures & Tests</p>
                                </div>
                                <button class="w-full mt-2 bg-[var(--btn-color)] text-white py-1.5 rounded-xl text-xs font-bold shadow-[0_4px_10px_rgba(0,0,0,0.3)] border border-[var(--btn-color)]">Active Sync</button>
                            </div>

                            <!-- YouTube -->
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                    <i class="fa-brands fa-youtube"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white">YouTube</h4>
                                    <p class="text-[10px] text-gray-400 mt-0.5">Edu Playlists</p>
                                </div>
                                <button class="w-full mt-2 bg-white/10 text-white py-1.5 rounded-xl text-xs font-bold hover:bg-white/20 transition-colors">Connect</button>
                            </div>

                            <!-- Coursera -->
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white">Coursera</h4>
                                    <p class="text-[10px] text-gray-400 mt-0.5">Track Courses</p>
                                </div>
                                <button class="w-full mt-2 bg-white/10 text-white py-1.5 rounded-xl text-xs font-bold hover:bg-white/20 transition-colors">Connect</button>
                            </div>

                            <!-- Udemy -->
                            <div class="bento-card-small p-4 flex flex-col items-center text-center gap-2">
                                <div class="w-12 h-12 rounded-full bg-purple-500/10 text-purple-400 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                                    <i class="fa-solid fa-laptop-code"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white">Udemy</h4>
                                    <p class="text-[10px] text-gray-400 mt-0.5">Sync Progress</p>
                                </div>
                                <button class="w-full mt-2 bg-white/10 text-white py-1.5 rounded-xl text-xs font-bold hover:bg-white/20 transition-colors">Connect</button>
                            </div>
                        </div>
                    </div>

                    <!-- 2. WORKSPACE TOOLS SECTION -->
                    <div>
                        <h3 class="text-xs font-bold text-[var(--btn-color)] uppercase tracking-widest mb-3 px-1 mt-6">Workspace Tools</h3>
                        <div class="space-y-3">
                            <div class="bento-card p-4 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-lg text-blue-400 border border-white/10"><i class="fa-brands fa-google-drive"></i></div>
                                    <div>
                                        <h4 class="text-sm font-bold text-white">Google Drive</h4>
                                        <p class="text-[10px] text-gray-400">Import PDFs & Docs</p>
                                    </div>
                                </div>
                                <div class="ios-toggle" onclick="this.classList.toggle('active')"></div>
                            </div>

                            <div class="bento-card p-4 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-lg text-gray-200 border border-white/10"><i class="fa-solid fa-cube"></i></div>
                                    <div>
                                        <h4 class="text-sm font-bold text-white">Notion</h4>
                                        <p class="text-[10px] text-gray-400">Export AI Notes</p>
                                    </div>
                                </div>
                                <button class="bg-white/10 text-white px-4 py-1.5 rounded-full text-[10px] font-bold border border-white/20">Connect</button>
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        // ... (Keep the identical routing functions: navigate, initApp, logout) ...
        // Redefining them here for completeness
        function navigate(tab) {
            // Using a simple fallback for notes/scheduler/doubt so they don't break
            const fallbackHTML = `<div class="page-fade-enter h-full flex flex-col items-center justify-center pt-16"><i class="fa-solid fa-code text-4xl text-[var(--btn-color)] mb-4"></i><h2 class="text-2xl font-black">Module Active</h2><p class="text-sm text-gray-400">Engine running.</p></div>`;
            
            document.getElementById('app-content').innerHTML = Views[tab] || fallbackHTML;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        function initApp() {
            if(window.history.replaceState) window.history.replaceState(null, null, window.location.pathname);
            const savedThemeId = localStorage.getItem('vertex_theme') || 'default';
            const data = themes[savedThemeId] || themes['default'];
            const root = document.documentElement;
            root.style.setProperty('--bg-image', `url('${data.bg}')`);
            root.style.setProperty('--btn-color', data.btnColor);
            const rawName = localStorage.getItem('vertex_dummy_user') || 'Agent L';
            document.getElementById('userName').innerText = rawName.toUpperCase();
            document.getElementById('userAvatar').src = `https://api.dicebear.com/7.x/notionists/svg?seed=${rawName}&backgroundColor=transparent`;
            navigate('integration');
        }

        function logout() {
            localStorage.removeItem('vertex_dummy_user');
            window.location.href = 'auth.html'; 
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
