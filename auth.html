<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX NEXUS | Manga Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* COMIC / MANGA STYLE VARIABLES (NO NEON) */
        :root {
            --bg-url: url('https://images.unsplash.com/photo-1578022761797-b8636ac1773c?q=80&w=2000');
            --card-bg: #ffffff;
            --text-main: #000000;
            --accent: #f97316; /* Naruto Orange */
            --border-color: #000000;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-image 0.4s ease;
        }

        /* Comic Book Halftone Overlay */
        .bg-overlay {
            position: absolute; inset: 0; z-index: -1;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        /* CARTOON SHAPE CARD (Hard Shadows, Thick Borders) */
        .comic-card {
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 12px 12px 0px var(--border-color); /* Flat Hard Shadow */
            position: relative;
            transition: all 0.4s ease;
        }

        /* THE MASCOT CONTAINER (Popping out of the card) */
        .mascot-frame {
            position: absolute;
            top: -60px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 120px;
            background: #fff;
            border: 4px solid var(--border-color);
            border-radius: 50%;
            box-shadow: 6px 6px 0px var(--border-color);
            overflow: hidden;
            z-index: 20;
            animation: mascotFloat 3s ease-in-out infinite alternate;
        }
        @keyframes mascotFloat {
            0% { transform: translateX(-50%) translateY(0px); }
            100% { transform: translateX(-50%) translateY(-10px); }
        }

        /* COMIC INPUTS */
        .input-comic {
            width: 100%; background: #fff; color: #000;
            border: 3px solid var(--border-color); border-radius: 12px;
            padding: 14px 16px; font-size: 15px; font-weight: 700; outline: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            margin-bottom: 16px; transition: all 0.2s ease;
        }
        .input-comic:focus {
            box-shadow: 6px 6px 0px var(--accent);
            transform: translate(-2px, -2px);
        }
        .input-comic::placeholder { color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* CARTOON ACTION BUTTON */
        .btn-comic {
            background: var(--accent); color: #fff; font-weight: 900;
            border: 4px solid var(--border-color); border-radius: 14px;
            box-shadow: 6px 6px 0px var(--border-color);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            height: 60px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.1s ease; cursor: pointer; width: 100%;
        }
        .btn-comic:active {
            transform: translate(6px, 6px); /* Button actually pushes down */
            box-shadow: 0px 0px 0px var(--border-color);
        }

        /* Action GIF (Rasengan etc) */
        .action-gif { height: 35px; width: auto; object-fit: contain; }

        /* THEME STUDIO (Comic Panel Style) */
        .theme-studio {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .theme-studio.active { opacity: 1; pointer-events: auto; }
        
        .theme-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 16px; max-height: 65vh; overflow-y: auto; width: 100%; max-w: 600px; padding: 10px; 
        }
        
        .theme-btn {
            background: #fff; border: 3px solid #000; border-radius: 16px; padding: 10px; 
            box-shadow: 4px 4px 0px #000; text-align: left; transition: all 0.2s; cursor: pointer;
        }
        .theme-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--accent); }

        .theme-poster-mini {
            width: 100%; height: 80px; rounded-lg; border: 2px solid #000; mb-2;
            background-size: cover; background-position: center; border-radius: 8px; margin-bottom: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">
    
    <div class="bg-overlay"></div>

    <!-- Branding -->
    <div class="absolute top-6 left-6 z-40 cursor-pointer" onclick="window.location.href='/index.html'">
        <span class="text-3xl font-black tracking-widest text-white drop-shadow-[4px_4px_0px_#000]" style="text-shadow: 3px 3px 0px var(--accent), 4px 4px 0px #000;">VERTEX</span>
    </div>

    <!-- Open Theme Studio -->
    <button onclick="openThemeStudio()" class="absolute top-6 right-6 z-40 bg-white text-black border-4 border-black px-4 py-2 rounded-xl text-xs font-black uppercase shadow-[4px_4px_0px_#000] hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_var(--accent)] transition-all flex items-center gap-2">
        <span class="w-3 h-3 rounded-full border-2 border-black" style="background: var(--accent);"></span> THEMES
    </button>

    <!-- CARTOON SHAPE AUTH CARD -->
    <div class="comic-card w-full max-w-[380px] p-8 relative z-10 mt-16 pt-16">
        
        <!-- THE MASCOT -->
        <div class="mascot-frame">
            <img id="mascotImage" src="https://media.tenor.com/5O29qG3fC4AAAAAi/naruto-chibi.gif" class="w-full h-full object-cover bg-white" alt="Mascot">
        </div>

        <div class="text-center mb-8">
            <div class="text-[11px] font-black uppercase tracking-widest px-3 py-1 border-2 border-black inline-block rounded-full mb-2 shadow-[2px_2px_0px_#000]" style="background: var(--accent); color: white;" id="cardThemeCat">NARUTO</div>
            <h2 id="formTitle" class="text-3xl font-black tracking-tighter" style="color: var(--border-color);">LOGIN</h2>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <input type="text" id="nameInput" class="input-comic hidden" placeholder="Full Name" autocomplete="name">
            <input type="email" id="emailInput" class="input-comic" placeholder="Email Address" required autocomplete="username">
            <input type="password" id="passwordInput" class="input-comic" placeholder="Passcode" required autocomplete="current-password">

            <!-- THE ACTION BUTTON (Rasengan, etc) -->
            <button type="submit" id="submitBtn" class="btn-comic mt-2">
                <span id="btnText">ENTER SYSTEM</span>
            </button>
            
            <p id="msgBox" class="text-xs font-black text-center hidden mt-5 p-3 rounded-xl uppercase border-4 border-black shadow-[4px_4px_0px_#000]"></p>
        </form>

        <div class="text-center text-xs mt-8 font-bold text-gray-600 uppercase border-t-4 border-black pt-5">
            <span id="toggleText">Don't have an account?</span> 
            <button onclick="toggleMode()" id="toggleBtn" class="text-black hover:underline ml-1" style="color: var(--accent);">Sign Up</button>
        </div>
    </div>

    <!-- THEME STUDIO (Manga Panel Style) -->
    <div id="themeStudio" class="theme-studio">
        <div class="comic-card w-full max-w-2xl p-6 relative flex flex-col">
            <button onclick="closeThemeStudio()" class="absolute -top-4 -right-4 bg-white border-4 border-black w-10 h-10 rounded-full font-black text-xl shadow-[4px_4px_0px_#000] hover:bg-red-500 hover:text-white transition-colors z-50">✕</button>
            
            <div class="text-center mb-6">
                <h2 class="text-3xl font-black uppercase drop-shadow-[2px_2px_0px_var(--accent)]">Choose Mascot</h2>
            </div>

            <!-- Mascot Grid -->
            <div class="theme-grid" id="themeGrid"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://memwikauqfvctwbrgmgf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbXdpa2F1cWZ2Y3R3YnJnbWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njc4NDcsImV4cCI6MjEwNTE0Mzg0N30.f1MbDY5DGxaYwVnOBrN8N0ODWe9ZpYGmiL2NfvyIBCo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLogin = true;

        /* =========================================================
           MASCOT & ACTION ENGINE (No Neon, Pure Anime/Movie vibes)
        ========================================================= */
        const themes = {
            'naruto': { 
                name: 'Ninja Mode', cat: 'Naruto', 
                bg: 'https://images2.alphacoders.com/131/1314488.jpeg',
                mascot: 'https://media.tenor.com/5O29qG3fC4AAAAAi/naruto-chibi.gif', // Chibi Naruto Mascot
                accent: '#f97316', cardBg: '#ffffff', text: '#000000',
                actionGif: 'https://media.tenor.com/71233F62mXMAAAAi/naruto-rasengan.gif' // Rasengan!
            },
            'ayanokoji': { 
                name: 'White Room', cat: 'Classroom', 
                bg: 'https://images.unsplash.com/photo-1518378188025-22bd89516ee2?q=80&w=2000',
                mascot: 'https://media.tenor.com/E0nCwtYy7_MAAAAi/ayanokoji.gif', // Ayanokoji Face
                accent: '#dc2626', cardBg: '#0a0a0a', text: '#ffffff',
                actionGif: 'https://media.tenor.com/On7kvXhzmL4AAAAi/loading-gif.gif' 
            },
            'deathnote': { 
                name: 'Kira Protocol', cat: 'Death Note', 
                bg: 'https://images.alphacoders.com/202/202868.jpg', 
                mascot: 'https://media.tenor.com/7lSThk-27iAAAAAi/ryuk-death-note.gif', // Ryuk Mascot
                accent: '#000000', cardBg: '#ef4444', text: '#ffffff', // Red card
                actionGif: 'https://media.tenor.com/QeYg9t5s-FwAAAAi/death-note-writing.gif' 
            },
            'batman': { 
                name: 'Gotham Mode', cat: 'Batman', 
                bg: 'https://images.alphacoders.com/123/1230114.jpg',
                mascot: 'https://media.tenor.com/uR1d3XGg1jEAAAAi/batman-cute.gif', // Chibi Batman
                accent: '#eab308', cardBg: '#1f2937', text: '#ffffff',
                actionGif: 'https://media.tenor.com/PZt7H55-P5gAAAAi/batman-bat-signal.gif' // Bat Signal
            },
            'mumbai': { 
                name: 'Blue Army', cat: 'Cricket', 
                bg: 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000',
                mascot: 'https://media.tenor.com/83p8vjTjP4MAAAAi/cricket-ball.gif', // Cricket Ball Mascot
                accent: '#0284c7', cardBg: '#ffffff', text: '#000000',
                actionGif: 'https://media.tenor.com/On7kvXhzmL4AAAAi/loading-gif.gif' 
            }
        };

        let currentThemeId = 'naruto'; 

        function initThemeEngine() {
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            
            for (const [id, data] of Object.entries(themes)) {
                const btn = document.createElement('div');
                btn.className = 'theme-btn';
                btn.onclick = () => applyTheme(id);
                btn.innerHTML = `
                    <div class="theme-poster-mini" style="background-image: url('${data.bg}');"></div>
                    <div class="text-[10px] uppercase font-black text-gray-500">${data.cat}</div>
                    <div class="text-sm font-black text-black">${data.name}</div>
                `;
                grid.appendChild(btn);
            }

            const saved = localStorage.getItem('vertex_theme') || 'naruto';
            if(themes[saved]) applyTheme(saved);
        }

        function applyTheme(id) {
            if(!themes[id]) return;
            currentThemeId = id;
            const data = themes[id];
            const root = document.documentElement;
            
            root.style.setProperty('--bg-url', `url('${data.bg}')`);
            root.style.setProperty('--card-bg', data.cardBg);
            root.style.setProperty('--text-main', data.text);
            root.style.setProperty('--accent', data.accent);
            
            // Adjust border colors for dark/light cards
            if(data.cardBg === '#ffffff') {
                root.style.setProperty('--border-color', '#000000');
            } else {
                root.style.setProperty('--border-color', '#ffffff');
            }
            
            document.getElementById('mascotImage').src = data.mascot;
            document.getElementById('cardThemeCat').innerText = data.cat;
            document.getElementById('cardThemeCat').style.background = data.accent;
            document.getElementById('cardThemeCat').style.color = (data.accent === '#ffffff' || data.accent === '#eab308') ? '#000' : '#fff';

            localStorage.setItem('vertex_theme', id);
            closeThemeStudio();
        }

        function openThemeStudio() { document.getElementById('themeStudio').classList.add('active'); }
        function closeThemeStudio() { document.getElementById('themeStudio').classList.remove('active'); }

        function toggleMode() {
            isLogin = !isLogin;
            const nameInput = document.getElementById('nameInput');
            const submitBtn = document.getElementById('submitBtn');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');
            const formTitle = document.getElementById('formTitle');

            if (isLogin) {
                nameInput.classList.add('hidden'); nameInput.removeAttribute('required');
                submitBtn.innerHTML = '<span id="btnText">ENTER SYSTEM</span>';
                formTitle.innerText = "LOGIN";
                toggleText.innerText = "Don't have an account?"; toggleBtn.innerText = 'Sign Up';
            } else {
                nameInput.classList.remove('hidden'); nameInput.setAttribute('required', 'true');
                submitBtn.innerHTML = '<span id="btnText">CREATE ACCOUNT</span>';
                formTitle.innerText = "REGISTER";
                toggleText.innerText = "Already an agent?"; toggleBtn.innerText = 'Login';
            }
        }

        // THE MASCOT ACTION ENGINE (Rasengan etc on click)
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');
            
            const activeActionGif = themes[currentThemeId].actionGif;

            // PRESS ANIMATION (Manga Style)
            btn.innerHTML = `<img src="${activeActionGif}" class="action-gif" alt="Action"> <span>BOOM...</span>`;
            msgBox.classList.add('hidden');

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMsg('SUCCESS! WELCOME BACK.', 'text-green-600', 'bg-green-100');
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
                    if (error) throw error;
                    showMsg('ACCOUNT CREATED.', 'text-green-600', 'bg-green-100');
                    setTimeout(() => toggleMode(), 2000);
                }
            } catch (error) {
                showMsg(error.message, 'text-red-600', 'bg-red-100');
                btn.innerHTML = isLogin ? '<span>ENTER SYSTEM</span>' : '<span>CREATE ACCOUNT</span>';
            }
        }

        function showMsg(text, textColor, bgColor) {
            const msgBox = document.getElementById('msgBox');
            msgBox.className = `text-xs font-black text-center mt-5 p-3 rounded-xl uppercase border-4 border-[var(--border-color)] shadow-[4px_4px_0px_var(--border-color)] ${textColor} ${bgColor}`;
            msgBox.innerText = text; msgBox.classList.remove('hidden');
        }

        window.onload = initThemeEngine;
    </script>
</body>
</html>
