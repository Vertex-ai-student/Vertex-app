<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX | Secure Authentication</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1505909182942-e2f09aee3e89?q=80&w=2072&auto=format&fit=crop');
            --overlay: rgba(253, 251, 247, 0.4);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #d94b38;
        }

        .theme-dark {
            --bg-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop');
            --overlay: rgba(15, 23, 42, 0.6);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        /* Cinema & Anime Themes (Skipped extra themes to keep code clean, but logic remains) */
        .theme-batman {
            --bg-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2144&auto=format&fit=crop');
            --overlay: rgba(10, 10, 12, 0.8);
            --card-bg: rgba(15, 15, 18, 0.85);
            --card-border: rgba(234, 179, 8, 0.3);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #eab308;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .bg-overlay {
            position: absolute; inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: -1;
            transition: background 0.8s ease;
        }

        /* Ultra Premium Glass Card with Floating Animation */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatCard 6s ease-in-out infinite alternate;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(50px) scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes floatCard {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* Face in Circle - Tech Ring Animation */
        .avatar-ring {
            position: absolute; inset: -4px;
            border-top: 2px solid var(--accent);
            border-right: 2px solid transparent;
            border-bottom: 2px solid var(--accent);
            border-left: 2px solid transparent;
            border-radius: 50%;
            animation: spinRing 4s linear infinite;
        }
        .avatar-inner {
            position: absolute; inset: 2px;
            border-radius: 50%; overflow: hidden;
            border: 2px solid var(--card-border);
            box-shadow: 0 0 20px rgba(0,0,0,0.5) inset;
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* Staggered Form Inputs */
        .stagger-1 { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
        .stagger-2 { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; }
        .stagger-3 { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; opacity: 0; }
        .stagger-4 { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; opacity: 0; }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        input, select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(150, 150, 150, 0.2);
            font-family: inherit; /* Forces dropdown to use Jakarta Sans */
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            transform: scale(1.02);
            background: rgba(0, 0, 0, 0.1);
        }
        option { background-color: #111827; color: white; }

        .app-icon { background-color: var(--accent); color: white; transition: all 0.5s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    
    <div class="bg-overlay"></div>

    <div class="absolute top-6 left-6 flex items-center gap-3 z-50">
        <div class="app-icon w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg">V</div>
        <span class="text-xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[var(--text-main)] to-[var(--text-muted)]">VERTEX</span>
    </div>

    <!-- Dropdown with Custom Font Styling -->
    <div class="absolute top-6 right-6 z-50">
        <select id="themeSelector" onchange="setTheme(this.value)" class="bg-black/60 backdrop-blur-md text-white px-4 py-2.5 rounded-xl text-xs font-bold border border-white/20 outline-none cursor-pointer appearance-none shadow-xl hover:scale-105 transition-transform">
            <option value="light">☀️ Light (Editorial)</option>
            <option value="dark">🌙 Dark (Cyber)</option>
            <option value="batman">🦇 Batman (Gotham)</option>
        </select>
    </div>

    <div class="glass-card w-full max-w-[380px] rounded-[2rem] p-8 relative z-10">
        
        <!-- Animated Face in Circle -->
        <div class="relative w-24 h-24 mx-auto mb-8 cursor-pointer group">
            <div class="avatar-ring group-hover:scale-110 transition-transform duration-500"></div>
            <div class="avatar-inner group-hover:scale-105 transition-transform duration-500">
                <img id="userAvatar" src="https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale opacity-90 hover:grayscale-0 transition-all duration-500" alt="Profile">
            </div>
        </div>

        <div class="text-center mb-8 stagger-1">
            <h2 id="formTitle" class="text-2xl font-bold tracking-tight">Identity Access</h2>
            <p id="formSubtitle" class="text-xs mt-1 font-medium text-[var(--text-muted)]">Authenticate to enter VERTEX.</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden stagger-2">
                <label class="block text-[10px] uppercase tracking-wider font-bold mb-1.5 text-[var(--text-muted)]">Legal Name</label>
                <input type="text" id="nameInput" autocomplete="name" placeholder="Aditya Singh" class="w-full px-4 py-3.5 rounded-xl outline-none text-sm transition-all duration-300">
            </div>

            <div class="stagger-2">
                <label class="block text-[10px] uppercase tracking-wider font-bold mb-1.5 text-[var(--text-muted)]">Email Address</label>
                <input type="email" id="emailInput" autocomplete="username" required placeholder="aditya@example.com" class="w-full px-4 py-3.5 rounded-xl outline-none text-sm transition-all duration-300">
            </div>

            <div class="stagger-3">
                <label class="block text-[10px] uppercase tracking-wider font-bold mb-1.5 text-[var(--text-muted)]">Passcode</label>
                <input type="password" id="passwordInput" autocomplete="current-password" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-xl outline-none text-sm transition-all duration-300">
            </div>

            <button type="submit" id="submitBtn" class="stagger-4 w-full py-4 mt-2 rounded-xl text-white font-bold text-sm shadow-xl transition-all hover:scale-[1.03] active:scale-95 flex justify-center items-center" style="background-color: var(--accent);">
                Authorize Link
            </button>
            
            <p id="msgBox" class="text-xs font-bold text-center hidden mt-4 p-3 rounded-xl tracking-wide"></p>
        </form>

        <div class="stagger-4 text-center text-xs mt-8 font-medium text-[var(--text-muted)] border-t border-gray-500/20 pt-6">
            <span id="toggleText">New to the network?</span> 
            <button onclick="toggleMode()" id="toggleBtn" class="font-bold hover:opacity-80 transition-opacity ml-1 uppercase tracking-wide" style="color: var(--accent);">Initialize</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://memwikauqfvctwbrgmgf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbXdpa2F1cWZ2Y3R3YnJnbWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Njc4NDcsImV4cCI6MjEwNTE0Mzg0N30.f1MbDY5DGxaYwVnOBrN8N0ODWe9ZpYGmiL2NfvyIBCo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLogin = true;

        function setTheme(theme) {
            document.body.className = `min-h-screen flex items-center justify-center p-4 relative theme-${theme}`;
            if(theme === 'light') document.body.className = `min-h-screen flex items-center justify-center p-4 relative`;
            localStorage.setItem('vertex_theme', theme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('vertex_theme') || 'light';
            document.getElementById('themeSelector').value = savedTheme;
            setTheme(savedTheme);
        };

        function toggleMode() {
            isLogin = !isLogin;
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const formTitle = document.getElementById('formTitle');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleBtn');
            const passInput = document.getElementById('passwordInput');

            if (isLogin) {
                nameField.classList.add('hidden');
                document.getElementById('nameInput').removeAttribute('required');
                submitBtn.innerText = 'Authorize Link';
                formTitle.innerText = 'Identity Access';
                toggleText.innerText = "New to the network?";
                toggleBtn.innerText = 'Initialize';
                passInput.setAttribute('autocomplete', 'current-password');
            } else {
                nameField.classList.remove('hidden');
                document.getElementById('nameInput').setAttribute('required', 'true');
                submitBtn.innerText = 'Establish Profile';
                formTitle.innerText = 'System Registry';
                toggleText.innerText = "Already registered?";
                toggleBtn.innerText = 'Access';
                passInput.setAttribute('autocomplete', 'new-password');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('msgBox');

            btn.innerHTML = `Verifying...`;
            msgBox.classList.add('hidden');

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMsg('ACCESS GRANTED.', 'text-emerald-500', 'bg-emerald-500/10');
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    showMsg('PROFILE ESTABLISHED.', 'text-emerald-500', 'bg-emerald-500/10');
                    setTimeout(() => toggleMode(), 2000);
                }
            } catch (error) {
                showMsg('ERROR: ' + error.message, 'text-red-500', 'bg-red-500/10');
            } finally {
                if(btn.innerHTML === 'Verifying...') btn.innerText = isLogin ? 'Authorize Link' : 'Establish Profile';
            }
        }

        function showMsg(text, textColor, bgColor) {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerText = text;
            msgBox.className = `text-[10px] font-bold text-center mt-4 p-3 rounded-xl uppercase tracking-wider ${textColor} ${bgColor} border`;
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
